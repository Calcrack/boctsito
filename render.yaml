services:
  - type: web
    name: boctsito
    env: node
    nodeVersion: 24.14.1
    buildCommand: npm install --prefix client && npm run build --prefix client && npm install --prefix server
    postBuildCommand: cd server && npm rebuild sqlite3 --build-from-source
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
